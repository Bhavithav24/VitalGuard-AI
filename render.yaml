services:
  - type: web
    runtime: static
    name: vitalguard-ai-bhavithav
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vitalguard-risk-api-bhavithav.onrender.com
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_APP_VERSION
        value: 1.0.0
    routes:
      # Required for React client-side routes such as /dashboard and /settings.
      - type: rewrite
        source: /*
        destination: /index.html

  # Existing shared Render Key Value service for distributed auth state.
  - type: keyvalue
    name: vitalguard-realtime-bhavithav
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []

  - type: web
    runtime: python
    name: vitalguard-risk-api-bhavithav
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vitalguard-postgres-bhavithav
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vitalguard-realtime-bhavithav
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGINS
        value: https://vitalguard-ai-bhavithav.onrender.com
      - key: VITALGUARD_AUTH_SECRET
        sync: false
      - key: VITALGUARD_AUTH_USERS_JSON
        sync: false
      - key: VITALGUARD_LIVE_SOURCE_TOKEN
        sync: false
      - key: VITALGUARD_DEMO_TELEMETRY_ENABLED
        value: "true"
      - key: VITALGUARD_DEMO_TELEMETRY_LOOP_ENABLED
        value: "false"

databases:
  # Existing Render Postgres service. Free tier is suitable for demo use only
  # and has a limited lifetime; upgrade before durable production use.
  - name: vitalguard-postgres-bhavithav
    postgresMajorVersion: "18"
    plan: free
    region: singapore
    databaseName: vitalguard_postgres_bhavithav
    user: vitalguard_postgres_bhavithav_user
    ipAllowList: []
